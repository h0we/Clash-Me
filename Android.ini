[custom]
; 不要随意改变关键字，否则会导致出错
; Subconverter 精简与高精度优化配置（适用于 Clash / OpenClash / Meta）

; 基础特性支持
; 去广告：支持
; 自动测速：支持
; 微软分流：合并入节点选择
; 苹果分流：直连
; 增强中国IP段：支持
; 增强国外GFW：支持

; ==================== 规则匹配顺序 (Ruleset) ====================
; 核心匹配原则：自上而下匹配，首次命中即止（First-Match-Wins）。
; 排序逻辑：用户自定义覆盖 > P2P/BT直连防御 > 局域网直连 > AI服务 > 电报消息 > 国外媒体 > 节点选择 > 国内兜底 > FINAL

; ----- 1. 用户自定义最高优先级覆盖 (绝对优先，防止被第三方规则截断) -----
ruleset=🎯 全球直连,https://raw.githubusercontent.com/h0we/Clash-Me/master/Direct.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/h0we/Clash-Me/master/unban.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/h0we/Clash-Me/master/P2P.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/h0we/Clash-Me/master/me.list

; ----- 2. P2P/BT 端口防御与基础局域网直连 -----
; 强制 BT 常见监听端口走直连，防止大流量打爆代理节点
ruleset=🎯 全球直连,[]DST-PORT,6881-6889
ruleset=🎯 全球直连,[]DST-PORT,51413
ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Direct/Direct.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/main/rule/Custom_Direct.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/SteamCN/SteamCN.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/PrivateTracker/PrivateTracker.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Download/Download.list

; ----- 3. AI 专属分组 (GPT / Claude / Gemini / Copilot / Perplexity / Grok 等) -----
; 必须排在国外媒体与通用代理之前，防止 AI 域名被大规则截获
ruleset=🤖 AI服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/AI.list
ruleset=🤖 AI服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list
ruleset=🤖 AI服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.list
ruleset=🤖 AI服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.list
ruleset=🤖 AI服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Copilot/Copilot.list

; ----- 4. 电报消息 -----
; 包含官方 IPv4/IPv6 CIDR 段与域名
ruleset=📲 电报消息,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list
ruleset=📲 电报消息,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list

; ----- 5. 国外媒体 (YouTube, TikTok, Netflix, Disney+, Amazon Prime, Spotify, HBO, 巴哈姆特等) -----
; 必须排在节点选择(Google等)之前，确保 YouTube 等媒体流量正确分流进国外媒体策略组
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Disney/Disney.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/AmazonPrimeVideo/AmazonPrimeVideo.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TikTok/TikTok.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Spotify/Spotify.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Bahamut/Bahamut.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/BiliBiliIntl/BiliBiliIntl.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/HBO/HBO.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Twitch/Twitch.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list

; ----- 6. 节点选择 (微软服务、谷歌、Twitter/X、GitHub、通用翻墙与 GFWList) -----
ruleset=🚀 节点选择,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Microsoft/Microsoft.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GoogleFCM/GoogleFCM.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleCNProxyIP.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Twitter/Twitter.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/main/rule/Custom_Proxy.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list

; ----- 7. 国内直连兜底与 GEOIP -----
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,[]GEOIP,LAN,no-resolve
ruleset=🎯 全球直连,[]GEOIP,CN,no-resolve

; ----- 8. 漏网之鱼 -----
ruleset=🐟 漏网之鱼,[]FINAL


; ==================== 策略组设置 (Custom Proxy Group) ====================
; 1. 🚀 节点选择：包含自动选择、全部代理节点、直连
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`.*`[]DIRECT

; 2. 🤖 AI服务：默认走节点选择，也可为 AI 单独指定优质专线（美/日/新等）
custom_proxy_group=🤖 AI服务`select`[]🚀 节点选择`.*`[]DIRECT

; 3. 📲 电报消息：默认走节点选择，也可单独指定节点
custom_proxy_group=📲 电报消息`select`[]🚀 节点选择`.*`[]DIRECT

; 4. 🌍 国外媒体：汇聚各大流媒体，可单独指定流媒体解锁节点（如台湾看动画疯、新加坡看Netflix）
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`.*`[]DIRECT

; 5. 🎯 全球直连：直连优先，备选节点选择
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择

; 6. 🐟 漏网之鱼：节点选择优先，备选直连
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`.*`[]DIRECT

; 7. ♻️ 自动选择：url-test 延迟测试组
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50

enable_rule_generator=true
overwrite_original_rules=true
clash_rule_base=https://raw.githubusercontent.com/h0we/Clash-Me/master/base.yaml
